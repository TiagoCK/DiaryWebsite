name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest release the test script runs on -- `node --test`
        # only accepts glob patterns from 22 onwards. 24 is what development
        # actually happens on.
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the point of a CI
      # run, and install would quietly resolve past it.
      - run: npm ci

      - run: npm run lint

      # No secrets, deliberately. Every page is force-dynamic and Supabase is
      # only reached per request, so the build and the whole suite run without
      # any credentials -- which also means CI never needs access to the diary.
      - run: npm run build

      - run: npm test
